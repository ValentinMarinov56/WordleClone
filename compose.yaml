services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in your local .env file}
    ports:
      - "1433:1433"
    volumes:
      - wordle-sql-data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: WordleClone.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=WordleCloneDb;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in your local .env file};TrustServerCertificate=True;Encrypt=False"
      SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local .env file}
    ports:
      - "5101:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  wordle-sql-data:
